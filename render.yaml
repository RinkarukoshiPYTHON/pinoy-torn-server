# Pinoy Torn server — Render Blueprint (one-click deploy)
# ==========================================================
# Paano gamitin:
#   1. I-push ang folder na ito sa GitHub (repo hal. `pinoy-torn-server`).
#   2. Sa Render: New → Blueprint → piliin ang repo.
#      Gagawin na nito ang Web Service (Free plan) at bubuo ng
#      random JWT_SECRET nang kusa — wala ka nang kailangang i-type.
#   3. Pagkatapos mag-deploy, buksan:
#        https://<service-name>.onrender.com/api/health
#      Dapat lumabas: {"ok":true,"players":12}
#
# Paalala (Render Free):
#   - Natutulog ang service pag walang gumagamit ng 15 minuto;
#     ~1 minuto magising ang unang bubukas.
#   - Naka-PostgreSQL na ang data (DATABASE_URL): hindi na nawawala ang
#     progress pag nag-restart o nag-redeploy ang server. Pero tandaan:
#     ang libreng PostgreSQL ng Render ay nag-e-expire pagkatapos ng
#     90 araw — bago dumating yun, ilipat sa Supabase/Neon (libre rin,
#     walang expiry) o sa bayad na plan.
#   - Bawat push sa GitHub = awtomatikong redeploy sa Render.

databases:
  - name: pinoy-torn-db
    plan: free
    databaseName: pinoy_torn
    user: pinoy_torn

services:
  - type: web
    name: pinoy-torn-server
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: pinoy-torn-db
          property: connectionString
